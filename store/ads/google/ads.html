<!doctype html>
<html><head><meta charset="utf-8">
<!-- Google Ads image assets. ?c=1..3 picks the concept, ?f=land|sq|port the size
     (1200×628, 1200×1200, 1200×1500). Rendered at the exact pixel size. -->
<style>
@font-face { font-family: P; font-weight: 400; src: url(../../../assets/fonts/Pretendard-Regular.otf); }
@font-face { font-family: P; font-weight: 500; src: url(../../../assets/fonts/Pretendard-Medium.otf); }
@font-face { font-family: P; font-weight: 600; src: url(../../../assets/fonts/Pretendard-SemiBold.otf); }
* { box-sizing: border-box; }
html, body { margin: 0; background: #000; overflow: hidden; font-family: P, sans-serif; color: #F2F2F2; word-break: keep-all; }
#stage { position: relative; overflow: hidden; background: #000; }
#photo { position: absolute; }
#photo img { width: 100%; height: 100%; display: block; }
.ring { position: absolute; border: 4px solid #F2F2F2; border-radius: 50%; transform: translate(-50%, -50%); }
#shade { position: absolute; inset: 0; }
#text { position: absolute; }
.k { color: #BDBDBD; font-weight: 500; letter-spacing: -0.02em; }
.h { font-weight: 600; letter-spacing: -0.045em; line-height: 1.22; }
.s { color: #CFCFCF; letter-spacing: -0.02em; line-height: 1.5; }
.brand { display: flex; align-items: center; font-weight: 600; letter-spacing: -0.03em; }
.brand img { border: 1.5px solid #3a3a3a; }
.level { position: absolute; }
.level .hz { position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: rgba(255,255,255,.4); }
.level .ln { position: absolute; left: 10%; right: 10%; top: 50%; height: 5px; margin-top: -2.5px; border-radius: 3px; background: #F2F2F2; }
.level .dot { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: #F2F2F2; }
.deg { position: absolute; font-weight: 500; letter-spacing: -0.03em; text-align: center; font-variant-numeric: tabular-nums; }
#phone { position: absolute; overflow: hidden; border-radius: 28px; border: 1.5px solid #333; }
#phone img { display: block; }
</style></head>
<body>
<div id="stage"></div>
<script>
const P = new URLSearchParams(location.search);
const C = +(P.get('c') || 1), F = P.get('f') || 'sq';
// ?notext=1: the image only (no copy, logo or angle numbers), for placements that prefer clean images.
const NOTEXT = P.get('notext') === '1';
// ?lang=en: English copy and the English app screenshot.
const EN = P.get('lang') === 'en';
const T = EN
  ? {
      sub: 'No camera, just your AirPods · Free on the App Store',
      c1k: 'When your head tilts', c1h: 'A soft cue plays<br>in that ear',
      c2k: 'At work, while studying', c2h: 'Is your head<br>leaning to one side?',
      c3k: 'Measured by your AirPods', c3h: 'Head tilt<br>alerts', c3hOne: 'Head tilt alerts',
      c3s: 'A cue in the ear you lean toward<br>No camera · Screen off · Free',
      c3sOne: 'A cue in the ear you lean toward · No camera · Free',
      shot: '../../screenshots/en-1.png',
    }
  : {
      sub: '카메라 없이, 에어팟만으로 · App Store 무료',
      c1k: '고개가 기울면', c1h: '그쪽 귀에서<br>"띵" 하고 알려줍니다',
      c2k: '일할 때, 공부할 때', c2h: '나도 모르게<br>고개가 기울어 있다면',
      c3k: '에어팟으로 재는', c3h: '고개 기울기<br>알림 앱', c3hOne: '고개 기울기 알림 앱',
      c3s: '기울면 그쪽 귀에서 알려줍니다<br>카메라 없이 · 화면 꺼도 · 무료',
      c3sOne: '기울면 그쪽 귀에서 알려줍니다 · 카메라 없이 · 무료',
      shot: '../../screenshots/ko-1.png',
    };
const SIZE = { land: [1200, 628], sq: [1200, 1200], port: [1200, 1500] }[F];
const [W, H] = SIZE;
const U = Math.min(W, H) / 100; // 1 unit = 1% of the short side
document.body.style.width = W + 'px'; document.body.style.height = H + 'px';
const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';

// Photo laid out like CSS "cover", but with a focal point that stays in frame, so marks drawn in
// image coordinates (the ear, the head) land on the right spot.
function photo(src, iw, ih, fx, fy, box = [0, 0, W, H]) {
  const [bx, by, bw, bh] = box;
  const s = Math.max(bw / iw, bh / ih);
  const w = iw * s, h = ih * s;
  const left = bx + Math.min(0, Math.max(bw - w, bw / 2 - fx * s));
  const top = by + Math.min(0, Math.max(bh - h, bh / 2 - fy * s));
  stage.insertAdjacentHTML('beforeend', `<div id="photo" style="left:${left}px;top:${top}px;width:${w}px;height:${h}px"><img src="${src}"></div>`);
  return (x, y) => [left + x * s, top + y * s];
}

const brand = (size) =>
  `<div class="brand" style="font-size:${size}px;gap:${size * 0.5}px"><img src="../../../assets/icon.png" style="width:${size * 1.8}px;height:${size * 1.8}px;border-radius:${size * 0.42}px">Plumb</div>`;

function text({ kicker, head, sub, align = 'left' }) {
  const land = F === 'land';
  const hs = land ? 6.4 * U : 7.4 * U, ss = land ? 3.2 * U : 3.4 * U, ks = land ? 2.9 * U : 3.1 * U;
  return `<div style="text-align:${align}">
    ${kicker ? `<div class="k" style="font-size:${ks}px;margin-bottom:${1.6 * U}px">${kicker}</div>` : ''}
    <div class="h" style="font-size:${hs}px">${head}</div>
    ${sub ? `<div class="s" style="font-size:${ss}px;margin-top:${2.2 * U}px">${sub}</div>` : ''}
    <div style="margin-top:${4 * U}px;display:flex;justify-content:${align === 'center' ? 'center' : 'flex-start'}">${brand(3.4 * U)}</div>
  </div>`;
}

function place(html, css) {
  if (NOTEXT) return;
  stage.insertAdjacentHTML('beforeend', `<div id="text" style="${css}">${html}</div>`);
}

function shade(css) { if (NOTEXT) return; stage.insertAdjacentHTML('beforeend', `<div id="shade" style="${css}"></div>`); }

function level(cx, cy, width, deg, label) {
  const h = 20;
  stage.insertAdjacentHTML('beforeend', `
    <div class="level" style="left:${cx - width / 2}px;top:${cy - h / 2}px;width:${width}px;height:${h}px">
      <div class="hz"></div><div class="ln" style="transform:rotate(${-deg}deg)"></div><div class="dot"></div></div>
    <div class="deg" style="left:${cx - 120}px;width:240px;top:${cy + 2.2 * U}px;font-size:${8 * U}px">${NOTEXT ? '' : label}</div>`);
}

const pad = 7 * U;
const SUB = T.sub;

if (C === 1) {
  // Ear close-up with the cue rings.
  const at = photo('src/ear.jpg', 1080, 1920, 732, 860);
  const [ex, ey] = at(732, 860);
  for (const [r, o] of [[4.5, 0.95], [9, 0.55], [14, 0.25]])
    stage.insertAdjacentHTML('beforeend', `<div class="ring" style="left:${ex}px;top:${ey}px;width:${2 * r * U}px;height:${2 * r * U}px;opacity:${o}"></div>`);
  if (F === 'land') {
    shade('background:linear-gradient(90deg, rgba(0,0,0,.9) 0%, rgba(0,0,0,.75) 38%, transparent 62%)');
    place(text({ kicker: T.c1k, head: T.c1h, sub: SUB }), `left:${pad}px;top:50%;transform:translateY(-50%);width:48%`);
  } else {
    shade('background:linear-gradient(transparent 35%, rgba(0,0,0,.88) 72%)');
    place(text({ kicker: T.c1k, head: T.c1h, sub: SUB }), `left:${pad}px;right:${pad}px;bottom:${pad}px`);
  }
} else if (C === 2) {
  // Laptop shot with the angle.
  const at = photo('src/laptop.jpg', 1080, 1920, 650, F === 'land' ? 820 : 980);
  if (F === 'land') {
    shade('background:linear-gradient(90deg, rgba(0,0,0,.9) 0%, rgba(0,0,0,.7) 40%, transparent 65%)');
    place(text({ kicker: T.c2k, head: T.c2h, sub: SUB }), `left:${pad}px;top:50%;transform:translateY(-50%);width:50%`);
    level(W * 0.78, H * 0.80, 30 * U, 12, '12°');
  } else {
    shade('background:linear-gradient(rgba(0,0,0,.55), transparent 30%, transparent 45%, rgba(0,0,0,.9) 75%)');
    level(W / 2, pad + 5 * U, 46 * U, 12, '12°');
    place(text({ kicker: T.c2k, head: T.c2h, sub: SUB }), `left:${pad}px;right:${pad}px;bottom:${pad}px`);
  }
} else {
  // The app itself.
  stage.style.background = '#000';
  const shot = (x, y, w, h) => {
    // App Store screenshot cropped to its phone frame.
    const iw = w * 1.186;
    stage.insertAdjacentHTML('beforeend', `<div id="phone" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
      <img src="${T.shot}" style="width:${iw}px;margin-left:${-iw * 0.078}px;margin-top:${-iw * 0.537}px"></div>`);
  };
  if (NOTEXT) {
    // Just the phone, centred.
    const pw = F === 'land' ? H * 0.5 : F === 'sq' ? 42 * U : 50 * U;
    shot(W / 2 - pw / 2, F === 'land' ? H * 0.08 : pad, pw, F === 'land' ? H : H - pad);
  } else if (F === 'land') {
    shot(W * 0.62, H * 0.1, H * 0.62, H * 1.0);
    place(text({ kicker: T.c3k, head: T.c3h, sub: T.c3s }), `left:${pad}px;top:50%;transform:translateY(-50%);width:52%`);
  } else {
    const pw = F === 'sq' ? 34 * U : 42 * U;
    shot(W / 2 - pw / 2, pad, pw, F === 'sq' ? H * 0.5 : H * 0.55);
    place(text({ kicker: T.c3k, head: T.c3hOne, sub: T.c3sOne, align: 'center' }), `left:${pad}px;right:${pad}px;bottom:${pad}px`);
  }
}

Promise.all([...document.images].map((im) => (im.complete ? 1 : new Promise((r) => (im.onload = im.onerror = r))))).then(() =>
  document.fonts.ready.then(() => (document.body.dataset.ready = '1')));
</script>
</body></html>
