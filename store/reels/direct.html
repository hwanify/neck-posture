<!doctype html>
<html><head><meta charset="utf-8">
<!-- Reel (1080×1920) that says it up front: "I made an app that…". Intro over the dimmed laptop shot,
     the tilt with the angle, the ear cue, the app with three facts, then the App Store card.
     Transparent overlay composited over the footage; render(t) is pure. -->
<style>
@font-face { font-family: P; font-weight: 400; src: url(../../assets/fonts/Pretendard-Regular.otf); }
@font-face { font-family: P; font-weight: 500; src: url(../../assets/fonts/Pretendard-Medium.otf); }
@font-face { font-family: P; font-weight: 600; src: url(../../assets/fonts/Pretendard-SemiBold.otf); }
* { box-sizing: border-box; }
html, body { margin: 0; width: 540px; height: 960px; background: transparent; overflow: hidden; font-family: P, sans-serif; color: #F2F2F2; word-break: keep-all; }
.abs { position: absolute; left: 0; right: 0; text-align: center; }
#dim { position: absolute; inset: 0; background: rgba(0,0,0,.72); }
#top { position: absolute; left: 0; right: 0; top: 0; height: 330px; background: linear-gradient(rgba(0,0,0,.75), transparent); }
#bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 420px; background: linear-gradient(transparent, rgba(0,0,0,.85) 45%); }
#intro { top: 300px; }
#intro img { width: 104px; height: 104px; border-radius: 24px; border: 1.5px solid #3a3a3a; display: block; margin: 0 auto 30px; }
#intro .l1 { font-size: 22px; color: #CFCFCF; letter-spacing: -0.4px; }
#intro .l2 { margin-top: 10px; font-weight: 600; font-size: 42px; line-height: 1.3; letter-spacing: -1.4px; }
#cap { top: 806px; font-weight: 500; font-size: 23px; letter-spacing: -0.6px; }
#sub { top: 845px; font-size: 16px; color: #BDBDBD; letter-spacing: -0.3px; }
#head { top: 120px; font-weight: 600; font-size: 34px; line-height: 1.3; letter-spacing: -1.3px; text-shadow: 0 2px 14px rgba(0,0,0,.5); }
#level { position: absolute; left: 50%; top: 690px; width: 300px; height: 12px; margin-left: -150px; }
#hz { position: absolute; left: 0; right: 0; top: 5.5px; height: 1.5px; background: rgba(255,255,255,.35); }
#ln { position: absolute; left: 50%; top: 4.5px; width: 240px; margin-left: -120px; height: 3px; border-radius: 2px; background: #F2F2F2; }
#dot { position: absolute; left: 50%; top: 0; width: 12px; height: 12px; margin-left: -6px; border-radius: 6px; background: #F2F2F2; }
#num { top: 714px; font-weight: 500; font-size: 46px; letter-spacing: -1.5px; font-variant-numeric: tabular-nums; }
.ring { position: absolute; border: 2.5px solid #F2F2F2; border-radius: 50%; }
#black { position: absolute; inset: 0; background: #000; }
#phone { position: absolute; left: 50%; top: 120px; width: 270px; height: 470px; margin-left: -135px; overflow: hidden; }
#phone img { width: 320px; margin-left: -25px; margin-top: -172px; display: block; }
#facts { position: absolute; left: 0; right: 0; top: 630px; display: flex; justify-content: center; gap: 10px; }
.fact { padding: 10px 16px; border-radius: 22px; border: 1.5px solid #4a4a4a; font-size: 17px; font-weight: 500; color: #E0E0E0; }
#end { top: 270px; }
#end img { width: 120px; height: 120px; border-radius: 27px; display: block; margin: 0 auto; border: 1.5px solid #3a3a3a; }
#end .name { font-weight: 600; font-size: 52px; letter-spacing: -2px; margin-top: 30px; }
#end .tag { font-size: 19px; color: #8E8E8E; margin-top: 8px; letter-spacing: -0.4px; }
#end .ask { display: inline-block; margin-top: 40px; padding: 14px 28px; border-radius: 30px; background: #F2F2F2; color: #000; font-weight: 600; font-size: 20px; letter-spacing: -0.4px; }
#end .s { margin-top: 16px; font-size: 16px; color: #8E8E8E; }
</style></head>
<body>
<div id="dim"></div>
<div id="top"></div>
<div id="bottom"></div>
<div id="intro" class="abs"><img src="../../assets/icon.png">
  <div class="l1">에어팟으로 고개 기울기를 알려주는</div>
  <div class="l2">앱을 만들었습니다</div></div>
<div id="head" class="abs"></div>
<div id="level"><div id="hz"></div><div id="ln"></div><div id="dot"></div></div>
<div id="num" class="abs"></div>
<div id="rings"></div>
<div id="cap" class="abs"></div>
<div id="sub" class="abs"></div>
<div id="black"></div>
<div id="phone"><img src="../screenshots/ko-1.png"></div>
<div id="facts"><div class="fact">카메라 없음</div><div class="fact">화면 꺼도 측정</div><div class="fact">무료</div></div>
<div id="end" class="abs"><img src="../../assets/icon.png"><div class="name">Plumb</div>
  <div class="tag">에어팟이 고개 기울기를 알려줘요</div>
  <div><span class="ask">App Store에서 무료로 받기</span></div>
  <div class="s">'Plumb' 검색 · 링크는 프로필에</div></div>
<script>
// Footage: 0–4.0 laptop shot (dimmed under the intro for 0–2.0) · 4.0–6.8 ear close-up (cue 4.25,
// sits up 5.6–6.6) · 6.8–9.3 app + facts on black · 9.3–12.3 App Store card.
const INTRO = 2.0, CUE = 4.25, APP = 6.8, END = 9.3;
const EAR_X = 345, EAR_Y = 440;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x); return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
const fade = (t, a, b, f = 0.3) => clamp(Math.min((t - a) / f, (b - t) / f));
const $ = (id) => document.getElementById(id);

const angleAt = (t) => (t < 5.6 ? 12 + 0.6 * Math.sin(t * 1.3) : 12 * (1 - ease((t - 5.6) / 1.0)));

function render(t) {
  // Intro: up front, from the very first frame.
  $('dim').style.opacity = 1 - clamp((t - INTRO + 0.25) / 0.25);
  $('intro').style.opacity = t < INTRO ? 1 : 0;
  $('intro').style.transform = `translateY(${(1 - ease(t / 0.4)) * 10}px)`;

  const footage = t >= INTRO && t < APP;
  $('top').style.opacity = $('bottom').style.opacity = footage ? 1 : 0;
  $('head').innerHTML = t >= INTRO && t < CUE ? '고개가 기울면' : t >= CUE && t < APP ? '그쪽 귀에서 "띵"' : '';
  $('head').style.opacity = footage ? 1 : 0;

  const a = angleAt(t);
  $('level').style.opacity = $('num').style.opacity = footage ? 1 : 0;
  $('ln').style.transform = `rotate(${-a}deg)`;
  $('num').textContent = `${Math.round(a)}°`;

  const caps = [
    [INTRO, CUE, '일할 때, 공부할 때', '나도 모르게 한쪽으로'],
    [CUE, 5.6, '기울어진 채 2초가 지나면', ''],
    [5.6, APP, '바로 세우면 조용해집니다', ''],
  ];
  const c = caps.find(([s, e]) => t >= s && t < e);
  $('cap').textContent = c ? c[2] : ''; $('sub').textContent = c ? c[3] : '';
  const o = c ? fade(t, c[0], c[1], 0.2) : 0;
  $('cap').style.opacity = o; $('sub').style.opacity = o;

  let rings = '';
  for (const start of [CUE, CUE + 0.35]) {
    const p = (t - start) / 1.1;
    if (p > 0 && p < 1) {
      const r = 20 + 120 * p;
      rings += `<div class="ring" style="left:${EAR_X - r}px;top:${EAR_Y - r}px;width:${2 * r}px;height:${2 * r}px;opacity:${(1 - p) * 0.9}"></div>`;
    }
  }
  $('rings').innerHTML = rings;

  $('black').style.opacity = clamp((t - APP + 0.2) / 0.2);
  const ph = fade(t, APP, END, 0.3);
  $('phone').style.opacity = ph;
  $('phone').style.transform = `translateY(${(1 - ease((t - APP) / 0.5)) * 40}px)`;
  [...document.querySelectorAll('.fact')].forEach((f, i) => {
    const s = APP + 0.5 + i * 0.4;
    f.style.opacity = Math.min(ph, clamp((t - s) / 0.25));
    f.style.transform = `translateY(${(1 - ease((t - s) / 0.35)) * 10}px)`;
  });

  $('end').style.opacity = clamp((t - END - 0.1) / 0.4);
  $('end').style.transform = `translateY(${(1 - ease((t - END - 0.1) / 0.6)) * 24}px)`;
}
window.render = render;
render(0);
</script>
</body></html>
