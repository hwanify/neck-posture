<!doctype html>
<html><head><meta charset="utf-8">
<!-- Carousel "고개가 한쪽으로 기우는 생활 습관 5가지", 1080×1350 (rendered at 540×675 × 2). ?s=1..7 picks the slide. -->
<style>
@font-face { font-family: P; font-weight: 400; src: url(../../assets/fonts/Pretendard-Regular.otf); }
@font-face { font-family: P; font-weight: 500; src: url(../../assets/fonts/Pretendard-Medium.otf); }
@font-face { font-family: P; font-weight: 600; src: url(../../assets/fonts/Pretendard-SemiBold.otf); }
* { box-sizing: border-box; }
html, body { margin: 0; width: 540px; height: 675px; background: #000; overflow: hidden; font-family: P, sans-serif; color: #F2F2F2; word-break: keep-all; }
.slide { position: absolute; inset: 0; display: none; }
.slide.on { display: block; }
.n { position: absolute; left: 44px; top: 56px; font-size: 15px; color: #8E8E8E; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
.h { position: absolute; left: 44px; right: 44px; font-weight: 600; font-size: 36px; line-height: 1.3; letter-spacing: -1.5px; }
.b { position: absolute; left: 44px; right: 44px; font-size: 18px; line-height: 1.6; color: #A8A8A8; letter-spacing: -0.4px; }
.fig { position: absolute; left: 50%; top: 270px; width: 400px; height: 325px; margin-left: -200px; }
.brand { position: absolute; left: 44px; bottom: 26px; font-size: 13px; color: #555; font-weight: 500; }
.page { position: absolute; right: 30px; bottom: 26px; font-size: 13px; color: #555; letter-spacing: 0.5px; }
.level { position: absolute; left: 50%; width: 360px; height: 14px; margin-left: -180px; }
.level .hz { position: absolute; left: 0; right: 0; top: 6px; height: 1.5px; background: #3A3A3A; }
.level .ln { position: absolute; left: 30px; right: 30px; top: 5px; height: 3.5px; border-radius: 2px; background: #F2F2F2; }
.level .dot { position: absolute; left: 50%; top: 0; width: 14px; height: 14px; margin-left: -7px; border-radius: 7px; background: #F2F2F2; }
.icon { width: 112px; height: 112px; border-radius: 26px; border: 1.5px solid #3a3a3a; display: block; }
.pill { display: inline-block; padding: 12px 24px; border-radius: 30px; background: #F2F2F2; color: #000; font-weight: 600; font-size: 18px; letter-spacing: -0.4px; }
</style></head>
<body>

<!-- 1. Cover -->
<section class="slide" id="s1">
  <div class="h" style="top:120px;font-size:42px">고개가 한쪽으로<br>기우는<br>생활 습관 5가지</div>
  <div class="b" style="top:322px">나도 모르게 매일 하고 있을지 모릅니다.</div>
  <div class="level" style="top:470px"><div class="hz"></div><div class="ln" style="transform:rotate(10deg)"></div><div class="dot"></div></div>
  <div class="b" style="top:560px;font-size:15px;color:#6a6a6a">저장해두고 하나씩 확인해보세요 →</div>
  <div class="brand">Plumb</div><div class="page">1 / 7</div>
</section>

<!-- 2–6. Habits (filled in by script) -->
<section class="slide habit" id="s2"></section>
<section class="slide habit" id="s3"></section>
<section class="slide habit" id="s4"></section>
<section class="slide habit" id="s5"></section>
<section class="slide habit" id="s6"></section>

<!-- 7. CTA -->
<section class="slide" id="s7">
  <div class="h" style="top:110px">스스로는<br>알아채기 어렵습니다.</div>
  <div class="b" style="top:228px">Plumb은 에어팟으로 고개 기울기를 재고,<br>기울어진 쪽 귀에서 작게 알려줍니다.</div>
  <div style="position:absolute;left:44px;top:350px;display:flex;align-items:center;gap:18px">
    <img class="icon" src="../../assets/icon.png">
    <div><div style="font-weight:600;font-size:34px;letter-spacing:-1.2px">Plumb</div>
      <div style="font-size:16px;color:#8E8E8E;margin-top:4px">카메라 없이 · 화면을 꺼도 · 무료</div></div>
  </div>
  <div style="position:absolute;left:44px;top:520px"><span class="pill">App Store 무료 · 프로필 링크</span></div>
  <div class="page">7 / 7</div>
</section>

<script>
// Line figure: shoulders, neck and head, drawn with the head tilted by `tilt` degrees (+ = right).
const W = '#F2F2F2', G = '#5a5a5a';
function person({ tilt = 0, shoulderL = 0, shoulderR = 0, extra = '' }) {
  const cx = 160, sy = 190;
  return `<svg viewBox="0 0 320 260" width="400" height="325" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M${cx - 95} 260 Q${cx - 95} ${sy + 8 - shoulderL} ${cx - 40} ${sy - shoulderL} L${cx + 40} ${sy - shoulderR} Q${cx + 95} ${sy + 8 - shoulderR} ${cx + 95} 260" stroke="${W}" stroke-width="3"/>
    <g transform="rotate(${tilt} ${cx} ${sy - 6})">
      <line x1="${cx}" y1="${sy - 4}" x2="${cx}" y2="${sy - 34}" stroke="${W}" stroke-width="3"/>
      <circle cx="${cx}" cy="${sy - 78}" r="44" stroke="${W}" stroke-width="3"/>
      <line x1="${cx - 70}" y1="${sy - 78}" x2="${cx + 70}" y2="${sy - 78}" stroke="${W}" stroke-width="1.5" stroke-dasharray="4 6" opacity=".6"/>
    </g>
    <line x1="${cx - 90}" y1="${sy - 78}" x2="${cx + 90}" y2="${sy - 78}" stroke="${G}" stroke-width="1.2"/>
    ${extra}
  </svg>`;
}

const HABITS = [
  {
    title: '모니터가<br>정면에 있지 않다',
    body: '화면이 한쪽에 있으면 고개도 그쪽으로<br>따라가 기울기 쉽습니다.',
    fig: person({ tilt: 9, extra: `<rect x="258" y="40" width="56" height="40" rx="4" stroke="${W}" stroke-width="2.5"/><line x1="286" y1="80" x2="286" y2="96" stroke="${W}" stroke-width="2.5"/>` }),
  },
  {
    title: '가방을 늘<br>한쪽 어깨로 멘다',
    body: '한쪽 어깨가 올라간 채로 걸으면<br>고개도 함께 기울어지기 쉽습니다.',
    fig: person({ tilt: -7, shoulderR: 12, extra: `<path d="M206 176 Q236 210 236 236" stroke="${W}" stroke-width="2.5"/><rect x="222" y="232" width="44" height="28" rx="5" stroke="${W}" stroke-width="2.5"/>` }),
  },
  {
    title: '전화를 어깨에<br>끼고 받는다',
    body: '손을 쓰면서 통화하는 동안<br>고개는 한쪽으로 꺾여 있습니다.',
    fig: person({ tilt: 16, shoulderR: 8, extra: `<rect x="196" y="132" width="16" height="40" rx="4" transform="rotate(-40 204 152)" stroke="${W}" stroke-width="2.5"/>` }),
  },
  {
    title: '소파 팔걸이에<br>기대 화면을 본다',
    body: '편한 자세일수록 기운 채로<br>오래 머물게 됩니다.',
    fig: person({ tilt: -13, shoulderL: -10, extra: `<rect x="4" y="196" width="58" height="64" rx="10" stroke="${W}" stroke-width="2.5"/>` }),
  },
  {
    title: '한 손으로만<br>폰을 본다',
    body: '폰을 든 쪽으로 고개가<br>살짝 기울어 있는 경우가 많습니다.',
    fig: person({ tilt: 8, extra: `<path d="M232 260 L262 214" stroke="${W}" stroke-width="2.5"/><rect x="250" y="168" width="28" height="48" rx="5" stroke="${W}" stroke-width="2.5"/>` }),
  },
];

HABITS.forEach((h, i) => {
  document.getElementById(`s${i + 2}`).innerHTML = `
    <div class="n">0${i + 1}</div>
    <div class="h" style="top:92px">${h.title}</div>
    <div class="b" style="top:200px">${h.body}</div>
    <div class="fig">${h.fig}</div>
    <div class="brand">Plumb</div><div class="page">${i + 2} / 7</div>`;
});

const s = new URLSearchParams(location.search).get('s') || '1';
document.getElementById('s' + s).classList.add('on');
document.body.dataset.ready = '1';
</script>
</body></html>
