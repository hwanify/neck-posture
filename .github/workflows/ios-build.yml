# Builds the iOS app on EAS (Expo's cloud Macs) and optionally sends it to TestFlight.
# Run it from GitHub: Actions → "iOS Build" → Run workflow. Setup: docs/IPHONE_SETUP.md
name: iOS Build

on:
  workflow_dispatch:
    inputs:
      submit:
        description: 'Send to TestFlight when the build finishes (needs the ASC_APP_ID variable)'
        type: boolean
        default: true

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EAS: npx --yes eas-cli@24.12.1
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: ${{ vars.APPLE_TEAM_TYPE || 'INDIVIDUAL' }}
      ASC_APP_ID: ${{ vars.ASC_APP_ID || '6820913429' }}
      SUBMIT: ${{ inputs.submit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Check secrets
        run: |
          for name in EXPO_TOKEN EXPO_ASC_KEY_ID EXPO_ASC_ISSUER_ID EXPO_APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret for $name — see docs/IPHONE_SETUP.md"
              exit 1
            fi
          done

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          if [ -z "$ASC_API_KEY_P8" ]; then echo "::error::Missing secret ASC_API_KEY_P8"; exit 1; fi
          printf '%s\n' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/asc_api_key.p8"
          echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/asc_api_key.p8" >> "$GITHUB_ENV"

      - name: Link EAS project
        run: |
          $EAS init --non-interactive --force
          $EAS update:configure --platform ios --non-interactive

      # Non-interactive builds can't create the first distribution certificate / provisioning profile.
      # Run the (always interactive) credentials setup under a pseudo-terminal, accepting every default;
      # with the ASC API key in the environment it authenticates with Apple by itself. Reuses existing
      # credentials on later runs.
      - name: Set up signing credentials
        run: |
          # A bounded number of Enter presses (an endless `yes` floods the log and the runner kills the job).
          (for i in $(seq 1 15); do sleep 2; echo; done) \
            | timeout 600 env -u CI script -qefc "$EAS credentials:configure-build --platform ios --profile production" /dev/null \
            > "$RUNNER_TEMP/credentials.log" 2>&1 || { tail -n 60 "$RUNNER_TEMP/credentials.log"; exit 1; }
          grep -E "credentials are ready|Distribution Certificate|Provisioning Profile" "$RUNNER_TEMP/credentials.log" || true

      - name: Build
        run: |
          FLAGS="--platform ios --profile production --non-interactive --no-wait"
          if [ "$SUBMIT" = "true" ]; then
            if [ -n "$ASC_APP_ID" ]; then
              node scripts/ci-configure-submit.js
              FLAGS="$FLAGS --auto-submit"
            else
              echo "::warning::ASC_APP_ID variable is not set yet — building without TestFlight submission."
            fi
          fi
          $EAS build $FLAGS
          echo "Build queued. Follow progress at https://expo.dev (Projects → baromok → Builds)." >> "$GITHUB_STEP_SUMMARY"
