# Publishes JS-only changes over the air to the App Store and TestFlight apps (channel "production").
# Manual only: the app is live, so an update goes out when someone runs this workflow on purpose,
# never on a push.
# Updates reach builds with the same app version (runtimeVersion policy "appVersion"). After a native
# change (modules/, app.json plugins, new native packages) bump "version" in app.json and run "iOS Build",
# so the new JS never lands on a binary that lacks its native code.
# To reach an older binary that is still in users' hands, set "app_version" to its version (e.g. 1.0.1);
# only do that when the JS still runs on that binary's native code.
name: OTA Update

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: App version to publish for (blank = the version in app.json)
        required: false
        default: ''

concurrency:
  group: ota-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      EAS: npx --yes eas-cli@24.12.1
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Skip until Expo is connected
        if: env.EXPO_TOKEN == ''
        run: echo "EXPO_TOKEN secret not set — skipping OTA update (see docs/IPHONE_SETUP.md)."
      - uses: actions/checkout@v4
        if: env.EXPO_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.EXPO_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - if: env.EXPO_TOKEN != ''
        run: npm ci
      - if: env.EXPO_TOKEN != ''
        run: npm run typecheck && npm test
      - name: Target an older app version
        if: env.EXPO_TOKEN != '' && inputs.app_version != ''
        env:
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          node -e "const f='app.json',j=require('./'+f);j.expo.version=process.env.APP_VERSION;require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          echo "Publishing for app version $APP_VERSION"
      - name: Publish update
        if: env.EXPO_TOKEN != ''
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'manual update' }}
        run: |
          $EAS init --non-interactive --force
          $EAS update:configure --platform ios --non-interactive
          $EAS update --channel production --platform ios --non-interactive \
            --message "$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | cut -c1-100)"
