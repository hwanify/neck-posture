# Uploads the App Store listing in store.config.json (name, description, keywords, review notes,
# age rating, categories) to App Store Connect. Run it from GitHub: Actions → "Store Metadata".
# Screenshots and the App Privacy answers are set in App Store Connect itself.
name: Store Metadata

on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      EAS: npx --yes eas-cli@24.12.1
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: ${{ vars.APPLE_TEAM_TYPE || 'INDIVIDUAL' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check placeholders
        run: |
          if grep -n "REPLACE_" store.config.json; then
            echo "::error::Fill in the review contact and copyright in store.config.json first."
            exit 1
          fi
      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s\n' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/asc_api_key.p8"
          echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/asc_api_key.p8" >> "$GITHUB_ENV"
      - name: Push metadata
        run: |
          $EAS init --non-interactive --force
          $EAS metadata:push --non-interactive
