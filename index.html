  .meta { margin-top: 16px; color: var(--sub); font-size: 14px; }

  section { padding: 72px 0; border-top: 1px solid var(--line); }

  .story p { color: #c8c8c8; font-size: 19px; margin: 0; }

  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 32px; }
  .step { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 26px 22px; }

  .step h3 { font-size: 19px; letter-spacing: -.3px; margin: 0 0 6px; font-weight: 600; }
  .step p { margin: 0; color: var(--sub); font-size: 15px; }

  /* Features */

  .feat { padding: 22px 0; border-bottom: 1px solid var(--line); }
  .feat h3 { margin: 0 0 4px; font-size: 18px; font-weight: 600; letter-spacing: -.3px; }
  .feat p { margin: 0; color: var(--sub); font-size: 15px; }

function detect() {
  const fromUrl = new URLSearchParams(location.search).get('lang');
  if (fromUrl && L[fromUrl]) return fromUrl;
  try { const saved = localStorage.getItem('plumb.lang'); if (saved && L[saved]) return saved; } catch (e) {}
  for (const tag of navigator.languages || [navigator.language || 'en']) {
    const code = tag.toLowerCase().split('-')[0];
    if (code === 'zh') return 'zh-Hans';
    if (L[code]) return code;
  }
  return 'en';
}

function apply(lang) {
  const s = L[lang];
  document.documentElement.lang = lang;
  document.title = s.title;
  document.querySelectorAll('[data-i]').forEach((el) => {
    const v = s[el.dataset.i] ?? L.en[el.dataset.i];
    if (el.dataset.i === 'heroTitle') el.innerHTML = v; else el.textContent = v;
  });
  document.querySelectorAll('[data-href]').forEach((el) => { el.href = LINKS[el.dataset.href]; });
  document.querySelectorAll('[data-cta]').forEach((el) => {
    el.classList.toggle('soon', !APP_STORE_URL);
    el.innerHTML = APPLE + '<span></span>';
    el.lastChild.textContent = APP_STORE_URL ? s.get : s.soon;
    if (APP_STORE_URL) el.href = APP_STORE_URL; else { el.removeAttribute('href'); el.setAttribute('aria-disabled', 'true'); }
  });
  document.getElementById('shots').innerHTML = SHOTS(lang).map((src) => `<img src="${src}" alt="" loading="lazy">`).join('');
  document.getElementById('lang').value = lang;
}

const select = document.getElementById('lang');
select.innerHTML = Object.entries(L).map(([code, s]) => `<option value="${code}">${s.name}</option>`).join('');
select.addEventListener('change', () => {
  try { localStorage.setItem('plumb.lang', select.value); } catch (e) {}
  apply(select.value);
});
apply(detect());
